dataset: hcp_wm_surf_unrelated
preprocess:
  out_dir: data/derived/hcp_wm_surf_unrelated
graph:
  spatial:
    type: mesh
    delta: 6.0
  temporal:
    type: chain
experiment:
  name: hcp181_nonconvex
  unit: pooled
  subjects: all
  outer_cv:
    type: group_kfold
    n_splits: 5
    group: subject
  inner_cv:
    type: group_kfold
    n_splits: 3
    group: subject
  selection_metric: neg_log_loss
  selection_rules:
  - min
  - 1se_repro
  split_half_seed: 2029
  repro_candidates_only: true
  split_half_group: subject
  n_jobs: 1
  solver:
    gamma: 0.001
    max_outer: 1000
    max_inner: 300
    tol_obj: 1.0e-06
    tol_x: 0.001
    epsilon_rel: 0.1
    apg_tol: 1.0e-06
  save_maps: true
  save_predictions: true
  methods:
  - name: nonconvex
    model: mlrdegg
    fixed:
      p_s: 0.5
      p_g: 0.5
      eta: 0.5
    grid:
      lambda_sel:
      - 0.2
      - 0.1
      - 0.05
      lambda_g:
      - 0.01
      - 0.03
      - 0.1
